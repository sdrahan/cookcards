<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="view(recipe)"
     class="space-y-6">

    <div>
        <h1 class="text-2xl font-semibold font-montserrat text-slate-900"
            th:text="${recipe.title}">Recipe title</h1>

        <p class="mt-1 text-xs font-lato text-slate-500"
           th:if="${recipe.servingsAndYield != null and !recipe.servingsAndYield.isEmpty()}"
           th:text="${#strings.listJoin(recipe.servingsAndYield, ' • ')}"></p>

        <p class="mt-1 text-xs font-lato text-slate-500"
           th:if="${recipe.times != null and !recipe.times.isEmpty()}"
           th:text="${#strings.listJoin(recipe.times, ' • ')}"></p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Ingredients -->
        <section>
            <h2 class="text-sm font-semibold font-montserrat text-slate-800 mb-2">Ingredients</h2>
            <ul class="list-disc pl-5 space-y-1 font-lato text-sm text-slate-800">
                <li th:each="ing : ${recipe.ingredients}"
                    th:text="${ing.item}">Ingredient</li>
            </ul>
        </section>

        <!-- Steps -->
        <section>
            <h2 class="text-sm font-semibold font-montserrat text-slate-800 mb-2">Steps</h2>
            <ol class="list-decimal pl-5 space-y-2 font-lato text-sm text-slate-800">
                <li th:each="st : ${recipe.steps}"
                    th:text="${st.text}">Step</li>
            </ol>
        </section>
    </div>

    <!-- Notes -->
    <section th:if="${recipe.notes != null and !recipe.notes.isEmpty()}">
        <h2 class="text-sm font-semibold font-montserrat text-slate-800 mb-2">Notes</h2>
        <ul class="list-disc pl-5 space-y-1 font-lato text-sm text-slate-700">
            <li th:each="n : ${recipe.notes}" th:text="${n}">Note</li>
        </ul>
    </section>

</div>

</body>
</html>
