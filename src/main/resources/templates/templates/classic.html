<div th:fragment="preview (recipe)" class="space-y-8 font-lato text-slate-900">
    <header class="border-b border-slate-200 pb-6">
        <p th:if="${recipe.language() != null}"
           class="text-xs uppercase tracking-widest text-slate-500 font-semibold">
            <span>Original language:</span>
            <span th:text="${recipe.language()}"></span>
        </p>
        <h2 class="text-4xl font-montserrat font-semibold text-slate-900 mt-2" th:text="${recipe.title()}"></h2>
        <div class="mt-4 flex flex-wrap gap-4 text-sm text-slate-600">
            <div th:if="${recipe.servingsAndYield() != null and !#lists.isEmpty(recipe.servingsAndYield())}"
                 class="flex items-center gap-2 flex-wrap">
                <span class="font-semibold text-slate-700">Yield:</span>
                <span th:each="line : ${recipe.servingsAndYield()}"
                      th:text="${line}"
                      class="border border-slate-200 rounded-full px-3 py-1 bg-white">Yield item</span>
            </div>
            <div th:if="${recipe.times() != null and !#lists.isEmpty(recipe.times())}"
                 class="flex items-center gap-2">
                <span class="font-semibold text-slate-700">Times:</span>
                <span th:each="time : ${recipe.times()}" class="border border-slate-200 rounded-full px-3 py-1"
                      th:text="${time}">Time</span>
            </div>
            <div th:if="${recipe.tags() != null and !#lists.isEmpty(recipe.tags())}"
                 class="flex items-center gap-2 flex-wrap">
                <span class="font-semibold text-slate-700">Tags:</span>
                <span th:each="tag : ${recipe.tags()}"
                      class="uppercase tracking-wide text-xs bg-slate-900 text-white px-2 py-1 rounded-full"
                      th:text="${tag}">Tag</span>
            </div>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
        <section>
            <h3 class="text-xl font-montserrat font-semibold mb-4">Ingredients</h3>
            <ul class="space-y-4">
                <li th:each="ingredient : ${recipe.ingredients()}" class="bg-slate-50 rounded-xl px-4 py-3 border border-slate-100">
                    <p th:if="${ingredient.section() != null and !#strings.isEmpty(ingredient.section())}"
                       class="text-xs uppercase tracking-wide text-slate-500 mb-1"
                       th:text="${ingredient.section()}">Section</p>
                    <p class="text-base text-slate-800 font-semibold">
                        <span th:if="${ingredient.quantity() != null}" class="mr-1" th:text="${ingredient.quantity()}"></span>
                        <span th:if="${ingredient.unit() != null}" class="mr-1" th:text="${ingredient.unit()}"></span>
                        <span th:text="${ingredient.item()}"></span>
                    </p>
                    <p th:if="${ingredient.preparation() != null}"
                       class="text-sm text-slate-500 mt-1"
                       th:text="${ingredient.preparation()}"></p>
                </li>
            </ul>
        </section>

        <section>
            <h3 class="text-xl font-montserrat font-semibold mb-4">Steps</h3>
            <ol class="space-y-4">
                <li th:each="step : ${recipe.steps()}" class="flex gap-4">
                    <div class="flex-shrink-0 w-10 h-10 rounded-full border-2 border-slate-900 text-slate-900 font-bold flex items-center justify-center">
                        <span th:text="${step.number()}"></span>
                    </div>
                    <p class="text-base leading-relaxed text-slate-800" th:text="${step.text()}"></p>
                </li>
            </ol>
        </section>
    </div>

    <section th:if="${recipe.notes() != null and !#lists.isEmpty(recipe.notes())}">
        <h3 class="text-xl font-montserrat font-semibold mb-3">Notes</h3>
        <ul class="space-y-2 list-disc list-inside text-slate-700">
            <li th:each="note : ${recipe.notes()}" th:text="${note}"></li>
        </ul>
    </section>

    <div th:if="${recipe.source() != null}" class="pt-4 border-t border-slate-200 text-sm text-slate-500">
        <span class="font-semibold text-slate-700">Source:</span>
        <span th:text="${recipe.source()}"></span>
    </div>
</div>
