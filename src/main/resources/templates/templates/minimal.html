<div th:fragment="preview (recipe)" class="space-y-6 text-slate-800">
    <div>
        <h2 class="text-3xl font-semibold tracking-tight" th:text="${recipe.title()}"></h2>
        <p th:if="${recipe.language() != null}" class="text-xs uppercase tracking-wide text-slate-500 mt-1"
           th:text="'Language: ' + ${recipe.language()}"></p>
        <div class="mt-4 text-sm space-y-1">
            <p th:if="${recipe.servingsAndYield() != null and !#lists.isEmpty(recipe.servingsAndYield())}">
                <span class="font-semibold">Yield:</span>
                <span th:each="line : ${recipe.servingsAndYield()}"
                      class="inline-block mr-2"
                      th:text="${line}"></span>
            </p>
            <p th:if="${recipe.times() != null and !#lists.isEmpty(recipe.times())}">
                <span class="font-semibold">Times:</span>
                <span th:each="time : ${recipe.times()}"
                      class="inline-block mr-2"
                      th:text="${time}"></span>
            </p>
        </div>
    </div>

    <section>
        <h3 class="text-lg font-semibold mb-3 tracking-wide uppercase text-slate-600">Ingredients</h3>
        <ul class="space-y-2">
            <li th:each="ingredient : ${recipe.ingredients()}" class="text-base leading-relaxed">
                <span th:if="${ingredient.section() != null}" class="block text-xs uppercase text-slate-400 tracking-wide mb-1"
                      th:text="${ingredient.section()}"></span>
                <span class="leading-tight">
                    <strong th:if="${ingredient.quantity() != null}" class="mr-1" th:text="${ingredient.quantity()}"></strong>
                    <strong th:if="${ingredient.unit() != null}" class="mr-1" th:text="${ingredient.unit()}"></strong>
                    <span th:text="${ingredient.item()}"></span>
                </span>
                <em th:if="${ingredient.preparation() != null}" class="text-sm text-slate-500"
                    th:text="' — ' + ${ingredient.preparation()}"></em>
            </li>
        </ul>
    </section>

    <section>
        <h3 class="text-lg font-semibold mb-3 tracking-wide uppercase text-slate-600">Steps</h3>
        <ol class="space-y-3 list-decimal list-inside leading-relaxed">
            <li th:each="step : ${recipe.steps()}" th:text="${step.text()}"></li>
        </ol>
    </section>

    <section th:if="${recipe.notes() != null and !#lists.isEmpty(recipe.notes())}">
        <h3 class="text-lg font-semibold mb-3 tracking-wide uppercase text-slate-600">Notes</h3>
        <ul class="space-y-1 text-sm">
            <li th:each="note : ${recipe.notes()}" th:text="${note}"></li>
        </ul>
    </section>

    <div th:if="${recipe.source() != null}" class="text-xs uppercase tracking-wide text-slate-500">
        <span>Source:</span>
        <span th:text="${recipe.source()}"></span>
    </div>
</div>
