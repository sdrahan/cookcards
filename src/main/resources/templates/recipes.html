<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@400;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>My recipes | Cookcards</title>
</head>
<body class="min-h-screen bg-white">

<div th:replace="~{fragments/nav :: topnav}"></div>

<main class="max-w-5xl mx-auto px-6 py-12">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-3xl font-semibold font-montserrat text-slate-800">My recipes</h1>
        <a th:href="@{/recipes/new}"
           class="inline-block px-4 py-2 rounded-lg bg-slate-900 text-white font-semibold font-lato">
            Add a recipe
        </a>
    </div>

    <p th:if="${param.deleteError}" class="text-red-600 text-sm font-lato mb-4">
        Could not delete recipe. Please try again.
    </p>

    <div th:if="${!hasRecipes}" class="text-center py-16 space-y-4">
        <p class="text-slate-600 font-lato">No recipes yet.</p>
        <a th:href="@{/recipes/new}"
           class="inline-block px-6 py-2 rounded-lg bg-slate-900 text-white font-semibold font-lato">
            Add a recipe
        </a>
    </div>

    <div th:if="${hasRecipes}" class="space-y-3">
        <div th:each="recipe : ${recipes}"
             class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between border border-slate-200 rounded-lg px-4 py-3">
            <div class="flex-1">
                <a th:href="@{/recipes/{id}(id=${recipe.id})}"
                   class="font-montserrat font-semibold text-slate-800 hover:text-slate-900">
                    <span th:text="${recipe.title}">Recipe title</span>
                </a>
            </div>
            <div class="flex items-center gap-3">
                <a th:href="@{/recipes/{id}(id=${recipe.id})}"
                   class="text-sm font-lato text-slate-700 hover:text-slate-900">
                    Open
                </a>
                <form th:action="@{/recipes/{id}/delete(id=${recipe.id})}" method="POST"
                      onsubmit="return confirm('Delete recipe? This cannot be undone.');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="text-sm font-lato text-red-600 hover:text-red-700">
                        Delete
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>

</body>
</html>
