<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@400;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>Create your account | Cookcards</title>
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-white">

<div class="text-center space-y-6 w-full max-w-md">
    <h1 class="text-3xl font-semibold font-montserrat mb-6">Create your account</h1>

    <form th:action="@{/signup}" method="POST" th:object="${signupForm}" class="space-y-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div>
            <label for="email" class="block text-left font-lato text-sm mb-1">Email</label>
            <input type="email" id="email" th:field="*{email}" required
                   class="w-full p-2 border border-gray-300 rounded text-sm font-lato">
            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-600 text-sm font-lato"></p>
        </div>

        <div>
            <label for="password" class="block text-left font-lato text-sm mb-1">Password</label>
            <input type="password" id="password" th:field="*{password}" required
                   class="w-full p-2 border border-gray-300 rounded text-sm font-lato">
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-600 text-sm font-lato"></p>
        </div>

        <button type="submit"
                class="w-full p-3 text-white text-sm font-lato rounded"
                style="background-color: #27AB83;">
            Create account
        </button>
    </form>

    <p class="text-sm font-lato">
        Already have an account? <a th:href="@{/login}" class="text-blue-600 underline">Log in</a>
    </p>
</div>

</body>
</html>
