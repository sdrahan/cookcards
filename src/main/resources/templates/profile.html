<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@400;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>Profile | Cookcards</title>
</head>
<body class="min-h-screen bg-white">

<div th:replace="~{fragments/nav :: topnav}"></div>

<main class="max-w-5xl mx-auto px-6 py-12 space-y-6">
    <h1 class="text-3xl font-semibold font-montserrat text-slate-800">Profile</h1>

    <p th:if="${param.saved}" class="text-sm font-lato text-green-700">
        Settings saved.
    </p>

    <div class="rounded-lg border border-slate-200 p-6">
        <p class="text-sm font-lato text-slate-500 mb-2">Email</p>
        <p class="font-lato text-slate-800" th:text="${email}">user@example.com</p>
    </div>

    <form th:action="@{/profile}" th:object="${profileForm}" method="POST"
          class="rounded-lg border border-slate-200 p-6 space-y-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div>
            <label for="unitsMode" class="block text-sm font-lato text-slate-600 mb-1">Units mode</label>
            <select id="unitsMode" th:field="*{unitsMode}"
                    class="w-full max-w-xs p-2 border border-gray-300 rounded text-sm font-lato bg-white">
                <option th:each="mode : ${unitsModes}"
                        th:value="${mode}"
                        th:text="${mode.label}">Original</option>
            </select>
        </div>

        <div>
            <label for="targetLanguage" class="block text-sm font-lato text-slate-600 mb-1">Target language</label>
            <select id="targetLanguage" th:field="*{targetLanguage}"
                    class="w-full max-w-xs p-2 border border-gray-300 rounded text-sm font-lato bg-white">
                <option th:each="language : ${targetLanguages}"
                        th:value="${language}"
                        th:text="${language.label}">Original</option>
            </select>
        </div>

        <button type="submit"
                class="inline-block px-4 py-2 rounded-lg bg-slate-900 text-white font-semibold font-lato">
            Save
        </button>
    </form>
</main>

</body>
</html>
