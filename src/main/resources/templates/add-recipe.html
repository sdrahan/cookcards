<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@400;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>Add recipe | Cookcards</title>
</head>
<body class="min-h-screen bg-white">

<div th:replace="~{fragments/nav :: topnav}"></div>

<main class="max-w-3xl mx-auto px-6 py-12">
    <div class="space-y-2 mb-6">
        <p class="text-sm font-lato text-slate-500">New recipe</p>
        <h1 class="text-3xl font-semibold font-montserrat text-slate-800">Add a recipe</h1>
    </div>

    <form th:action="@{/recipes/new}" th:object="${addRecipeForm}" method="post" class="space-y-4">
        <p th:if="${#fields.hasGlobalErrors()}"
           th:each="err : ${#fields.globalErrors()}"
           th:text="${err}"
           class="text-sm text-red-600 font-lato"></p>

        <div>
            <label for="freeText" class="block text-sm font-semibold font-lato text-slate-700 mb-2">
                Paste your recipe text
            </label>
            <textarea id="freeText"
                      th:field="*{freeText}"
                      rows="14"
                      class="w-full p-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 font-lato text-sm"
                      placeholder="Paste unstructured recipe text here..."></textarea>
            <p th:if="${#fields.hasErrors('freeText')}"
               th:errors="*{freeText}"
               class="mt-2 text-sm text-red-600 font-lato"></p>
        </div>

        <div class="flex justify-end">
            <button type="submit"
                    class="inline-block px-6 py-2 rounded-lg bg-slate-900 text-white font-semibold font-lato hover:bg-slate-800">
                Submit
            </button>
        </div>
    </form>
</main>

</body>
</html>
