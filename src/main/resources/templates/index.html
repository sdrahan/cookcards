<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@400;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">

    <title>CookCards</title>
</head>

<body class="flex flex-col items-center justify-center min-h-screen bg-gray-50">

<div class="w-full max-w-2xl px-6">

    <!-- Title -->
    <div class="text-center mb-8">
        <h1 class="text-4xl font-semibold font-montserrat text-slate-800">
            CookCards
        </h1>
        <p class="mt-2 text-sm font-lato text-slate-600">
            Paste a recipe (any language). We’ll turn it into a clean printable card.
        </p>
    </div>

    <!-- Form -->
    <form th:action="@{/parse}"
          th:object="${parseRequest}"
          method="post"
          class="space-y-4">

        <!-- Textarea -->
        <div>
            <label for="freeText"
                   class="block text-sm font-semibold font-lato text-slate-700 mb-1">
                Recipe text
            </label>

            <textarea id="freeText"
                      th:field="*{freeText}"
                      rows="10"
                      placeholder="Paste your recipe here…"
                      class="w-full p-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 font-lato text-sm"></textarea>

            <!-- Validation error -->
            <p th:if="${#fields.hasErrors('freeText')}"
               th:errors="*{freeText}"
               class="mt-1 text-sm text-red-600 font-lato">
            </p>
        </div>

        <!-- Submit -->
        <div class="flex justify-end">
            <button type="submit"
                    class="px-6 py-2 rounded-lg bg-blue-600 text-white font-semibold font-lato hover:bg-blue-700 transition">
                Parse recipe
            </button>
        </div>
    </form>

</div>

</body>
</html>
