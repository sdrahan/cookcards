<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@400;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">

    <title>Review | CookCards</title>
</head>

<body class="min-h-screen bg-gray-50">

<div class="max-w-6xl mx-auto px-6 py-10 space-y-8">

    <!-- Header -->
    <div class="flex items-start justify-between gap-6">
        <div>
            <h1 class="text-3xl font-semibold font-montserrat text-slate-800">Review</h1>
            <p class="mt-1 text-sm font-lato text-slate-600">
                Edit fields if needed, choose a template, then print from your browser.
            </p>
        </div>

        <div class="flex items-center gap-3">
            <a th:href="@{/}"
               class="text-sm font-lato text-blue-600 underline">
                ← Paste another recipe
            </a>
        </div>
    </div>

    <!-- Content -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

        <!-- Left: Editor -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-5">

            <div class="flex items-center justify-between">
                <h2 class="text-lg font-semibold font-montserrat text-slate-800">Recipe fields</h2>

                <!-- Template selector (no JS) -->
                <div class="flex items-center gap-2">
                    <label class="text-sm font-lato text-slate-600">Template</label>
                    <select class="text-sm font-lato border border-slate-300 rounded-lg px-3 py-2 bg-white"
                            onchange="window.location.href = this.value">
                        <option th:value="@{/review(template='classic')}"
                                th:selected="${selectedTemplate == 'classic'}">Classic</option>
                        <option th:value="@{/review(template='minimal')}"
                                th:selected="${selectedTemplate == 'minimal'}">Minimal</option>
                        <option th:value="@{/review(template='card')}"
                                th:selected="${selectedTemplate == 'card'}">Card</option>
                    </select>
                </div>
            </div>

            <!-- Edit form -->
            <!-- POST /review should update the RecipeDTO in session and redirect back to /review?template=... -->
            <form th:action="@{/review(template=${selectedTemplate})}"
                  th:object="${recipe}"
                  method="post"
                  class="space-y-4">

                <!-- Title -->
                <div>
                    <label class="block text-sm font-semibold font-lato text-slate-700 mb-1" for="title">Title</label>
                    <input id="title"
                           th:field="*{title}"
                           type="text"
                           class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 font-lato text-sm"/>
                </div>

                <!-- Ingredients (simple SuperMVP editor: multiline textarea) -->
                <!-- Recommendation: in controller map textarea lines -> ingredients list -->
                <div>
                    <label class="block text-sm font-semibold font-lato text-slate-700 mb-1" for="ingredientsText">
                        Ingredients (one per line)
                    </label>
                    <textarea id="ingredientsText"
                              name="ingredientsText"
                              rows="8"
                              class="w-full p-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 font-lato text-sm"
                              th:text="${ingredientsText}"></textarea>
                    <p class="mt-1 text-xs font-lato text-slate-500">
                        Tip: keep sections as plain lines like “For the dough:” if you want.
                    </p>
                </div>

                <!-- Steps -->
                <div>
                    <label class="block text-sm font-semibold font-lato text-slate-700 mb-1" for="stepsText">
                        Steps (one per line)
                    </label>
                    <textarea id="stepsText"
                              name="stepsText"
                              rows="8"
                              class="w-full p-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 font-lato text-sm"
                              th:text="${stepsText}"></textarea>
                </div>

                <!-- Notes -->
                <div>
                    <label class="block text-sm font-semibold font-lato text-slate-700 mb-1" for="notesText">
                        Notes (optional, one per line)
                    </label>
                    <textarea id="notesText"
                              name="notesText"
                              rows="4"
                              class="w-full p-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 font-lato text-sm"
                              th:text="${notesText}"></textarea>
                </div>

                <div class="flex items-center justify-end gap-3 pt-2">
                    <button type="submit"
                            class="px-6 py-2 rounded-lg bg-blue-600 text-white font-semibold font-lato hover:bg-blue-700 transition">
                        Update preview
                    </button>

                    <button type="button"
                            onclick="window.print()"
                            class="px-6 py-2 rounded-lg bg-slate-800 text-white font-semibold font-lato hover:bg-slate-900 transition">
                        Print
                    </button>
                </div>

            </form>
        </div>

        <!-- Right: Preview -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold font-montserrat text-slate-800">Preview</h2>
                <span class="text-xs font-lato text-slate-500" th:text="'Template: ' + ${selectedTemplate}"></span>
            </div>

            <div class="border border-slate-200 rounded-xl p-6 bg-white">

                <!-- Choose template fragment -->
                <div th:if="${selectedTemplate == 'classic'}"
                     th:replace="~{templates/classic :: view(recipe=${recipe})}"></div>

                <div th:if="${selectedTemplate == 'minimal'}"
                     th:replace="~{templates/minimal :: view(recipe=${recipe})}"></div>

                <div th:if="${selectedTemplate == 'card'}"
                     th:replace="~{templates/card :: view(recipe=${recipe})}"></div>

            </div>

            <p class="mt-4 text-xs font-lato text-slate-500">
                Printing tip: in your browser print dialog, disable headers/footers for cleaner cards.
            </p>
        </div>

    </div>
</div>

</body>
</html>
