<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="topnav" class="w-full border-b border-slate-200 bg-white">
    <div class="max-w-5xl mx-auto flex items-center justify-between px-6 py-4">
        <a th:href="@{/recipes}" class="font-montserrat text-lg font-semibold text-slate-800">Cookcards</a>
        <div class="flex items-center gap-4">
            <a th:href="@{/profile}" class="text-sm font-lato text-slate-700 hover:text-slate-900">
                Profile
            </a>
            <form th:action="@{/logout}" method="POST">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="text-sm font-lato text-slate-700 hover:text-slate-900">
                    Log out
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
