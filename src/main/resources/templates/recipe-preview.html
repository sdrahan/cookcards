<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@400;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>Recipe preview | Cookcards</title>
</head>
<body class="min-h-screen bg-white">

<div th:replace="~{fragments/nav :: topnav}"></div>

<main class="max-w-4xl mx-auto px-6 py-12 space-y-6">
    <div class="space-y-2">
        <p class="text-sm font-lato text-slate-500">Preview</p>
        <h1 class="text-3xl font-semibold font-montserrat text-slate-800" th:text="${recipe.name()}">Recipe Name</h1>
        <p th:if="${recipe.description()}" class="text-slate-600 font-lato" th:text="${recipe.description()}"></p>
    </div>

    <section class="rounded-lg border border-slate-200 p-5">
        <h2 class="text-xl font-semibold font-montserrat text-slate-800 mb-3">Ingredients</h2>
        <ul class="list-disc pl-6 space-y-1 font-lato text-slate-700">
            <li th:each="ingredient : ${recipe.ingredients()}" th:text="${ingredient}">Ingredient</li>
        </ul>
    </section>

    <section class="rounded-lg border border-slate-200 p-5 space-y-4">
        <h2 class="text-xl font-semibold font-montserrat text-slate-800">Instructions</h2>
        <div th:each="section : ${recipe.instructions()}" class="space-y-2">
            <h3 th:if="${section.name()}" class="font-semibold font-lato text-slate-700" th:text="${section.name()}"></h3>
            <ol class="list-decimal pl-6 space-y-2 font-lato text-slate-700">
                <li th:each="step : ${section.steps()}" th:text="${step.text()}"></li>
            </ol>
        </div>
    </section>

    <form th:action="@{/recipes/preview/save}" method="post" class="flex justify-end">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit"
                class="inline-block px-6 py-2 rounded-lg bg-slate-900 text-white font-semibold font-lato hover:bg-slate-800">
            Save
        </button>
    </form>
</main>

</body>
</html>
